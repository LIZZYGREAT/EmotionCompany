name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  unit-cpu:
    name: unit-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install minimal pinned CI dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pytest==9.1.1' \
            'PyYAML==6.0.3' \
            'jsonschema==4.26.0' \
            'sacrebleu==2.5.1'

      - name: Check syntax and pushed diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m compileall -q src scripts participant tests
          bash -n participant/start.sh
          bash -n scripts/e01_b_pilot.sh
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "origin/main...$EVENT_SHA"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$EVENT_SHA"
          else
            BASE_SHA="$(git merge-base origin/main "$EVENT_SHA")"
            git diff --check "$BASE_SHA" "$EVENT_SHA"
          fi

      - name: Run CPU synthetic regression suite
        run: |
          python -m pytest -q \
            tests/test_competition_contract.py \
            tests/test_data_audit.py \
            tests/test_data_pipeline.py \
            tests/test_e00_metrics.py \
            tests/test_e00_runner.py \
            tests/test_inference_resume.py \
            tests/test_e01_b_evaluate.py \
            tests/test_e01_b_diagnose.py \
            tests/test_e02_vllm_protocol.py \
            tests/test_e02_token_equivalence.py \
            tests/test_e02_benchmark_selection.py \
            tests/test_e00_2_diagnose.py \
            tests/test_e00_2_emotion_diag.py \
            tests/test_e03_a3_profile.py \
            tests/test_e03_profile_prefix.py \
            tests/test_e03_profile_fast_eval.py \
            tests/test_e03_a4_profile_reconcile.py \
            tests/test_e03_a4_stability_metrics.py \
            tests/test_e03_a4_stability_eval.py \
            tests/test_e03_pipeline_audit.py \
            tests/test_e03_experiment_spec.py \
            tests/test_e03_experiment_ctl.py \
            tests/test_e03_a6_protocol.py \
            tests/test_e03_a6_data.py \
            tests/test_e03_a6_runner.py \
            tests/test_e03_a6_f4_protocol.py \
            tests/test_e03_a6_f4_staged_contract.py \
            tests/test_e03_a6_f4_staged_resume.py \
            tests/test_e03_a6_f4_staged_fast.py \
            tests/test_e03_a8_replay.py \
            tests/test_final_dual_protocol.py \
            tests/test_final_dual_vllm.py \
            tests/test_final_dual_inference.py \
            tests/test_final_dual_entrypoint.py \
            tests/test_final_dual_docker_package.py \
            tests/test_final_dual_overlay.py
